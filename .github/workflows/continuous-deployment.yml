name: Continuous Deployment

# Only one release may be in flight at a time. Never cancel a run mid-way: a cancelled
# matrix leaves some blocks published and some not, and the released/* tags are what let
# the next run recover.
concurrency:
  group: continuous-deployment
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      blocks: ${{ steps.plan.outputs.blocks }}
      count: ${{ steps.plan.outputs.count }}

    steps:
      - name: Checkout current commit
        uses: actions/checkout@v6
        with:
          # Full history and tags: the plan diffs each block against its released/<block> tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Use pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve the release plan
        id: plan
        run: |
          pnpm exec blocks-release plan --json > plan.json
          echo "blocks=$(jq -c '.blocks' plan.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.blocks | length' plan.json)" >> "$GITHUB_OUTPUT"

      - name: Summarise
        run: pnpm exec blocks-release plan >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: plan
    if: needs.plan.outputs.count != '0'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write # to push the released/<block> tag

    strategy:
      # One block failing must not strand the rest. Re-running the workflow re-plans from
      # the tags and retries only what did not get through.
      fail-fast: false
      max-parallel: 4
      matrix:
        block: ${{ fromJson(needs.plan.outputs.blocks) }}

    steps:
      - name: Checkout current commit
        uses: actions/checkout@v6

      - name: Use pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Uploads the built bundle and sources as a new DRAFT version of the app.
      # --no-verify: the CI workflow already linted and typechecked this commit.
      - name: Deploy ${{ matrix.block.name }}
        working-directory: ${{ matrix.block.path }}
        env:
          FRONTIFY_TOKEN: ${{ secrets.FRONTIFY_ACCESS_TOKEN }}
          FRONTIFY_INSTANCE: ${{ secrets.FRONTIFY_INSTANCE_URL }}
        run: |
          pnpm exec frontify-cli deploy \
            --entryPath src/index.ts \
            --no-verify \
            --token="$FRONTIFY_TOKEN" \
            --instance="$FRONTIFY_INSTANCE"

      # Sets availability, writes the changelog, and moves the draft out of DRAFT.
      # RELEASE_NOTES goes through the environment, never through the shell command line --
      # the notes are free text and would otherwise need quoting.
      - name: Publish ${{ matrix.block.name }}
        working-directory: ${{ matrix.block.path }}
        env:
          FRONTIFY_TOKEN: ${{ secrets.FRONTIFY_ACCESS_TOKEN }}
          FRONTIFY_INSTANCE: ${{ secrets.FRONTIFY_INSTANCE_URL }}
          RELEASE_NOTES: ${{ matrix.block.notes }}
        run: |
          pnpm exec frontify-cli publish \
            --release-notes="$RELEASE_NOTES" \
            --availability=COMMUNITY \
            --token="$FRONTIFY_TOKEN" \
            --instance="$FRONTIFY_INSTANCE"

      - name: Record the published commit
        run: |
          pnpm exec blocks-release mark --block "${{ matrix.block.name }}" --ref "$GITHUB_SHA"
          git push --force origin "refs/tags/released/${{ matrix.block.name }}"

  finalize:
    needs: [plan, publish]
    # Only clear the entry files when every block made it. A partial release keeps its
    # entries so the retry still has the notes.
    if: needs.plan.outputs.count != '0' && !contains(needs.publish.result, 'failure')

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.FRONTIFY_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.FRONTIFY_RELEASE_APP_PRIVATE_KEY }}
          repositories: guideline-blocks
          permission-contents: write

      - name: Checkout current commit
        uses: actions/checkout@v6
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Use pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clear the consumed release entries
        run: |
          pnpm exec blocks-release clean

          if git diff --quiet -- .releases; then
            echo "No entries to clear."
            exit 0
          fi

          git config user.name "frontify-release[bot]"
          git config user.email "frontify-release[bot]@users.noreply.github.com"
          git add .releases
          git commit -m "chore: clear released changelog entries [skip ci]"
          git push origin HEAD:main
